# Coolify Configuration for HodoorK System (at.baitak.mtapp.ly)
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres_pass_2026@postgres:5432/hodoork_db?schema=public
      - NEXTAUTH_SECRET=hodoork_super_secret_jwt_key_2026
      - NEXT_PUBLIC_APP_URL=https://at.baitak.mtapp.ly
    labels:
      - "coolify.managed=true"
      - "coolify.domain=at.baitak.mtapp.ly"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_pass_2026
      POSTGRES_DB: hodoork_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
